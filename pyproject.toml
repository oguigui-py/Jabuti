[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jabuti"
version = "0.1.0"
description = "Visualizador offline de árvores filogenéticas (estilo iTOL simplificado)"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4", "pyflakes>=3", "pyinstaller>=6"]

[project.gui-scripts]
jabuti = "jabuti.cli:main"

[tool.setuptools.packages.find]
include = ["jabuti*"]

[tool.setuptools.package-data]
# PyInstaller: incluir também datas=[("jabuti/assets", "jabuti/assets")]
jabuti = ["assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
